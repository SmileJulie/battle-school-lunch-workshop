[project]
name = "battle-school-lunch-mcp"
version = "0.1.0"
description = "MCP server for NEIS school lunch lookup"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "mcp>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
